# Compiles and tests Pyrite on macOS, Windows and Linux for every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  # The Ubuntu runner only proves Pyrite builds against Debian's packaging of
  # GTK and WebKitGTK. Fedora names and splits those libraries differently, so
  # compile there too rather than hearing about it in a bug report.
  fedora:
    name: fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # Before the checkout, so actions/checkout can use git.
      - name: System libraries
        run: |
          dnf install -y git nodejs npm rust cargo \
            webkit2gtk4.1-devel gtk3-devel openssl-devel libxdo-devel librsvg2-devel

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: fedora

      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
